# ERA5 points (Open-Meteo archive, model "era5", 0.25 deg grid) used to model wind and PV output in other weather
# years. Onshore wind and PV points cover the regions where the Polish fleets stand; the weights of the points are
# not set by hand but fitted (non-negative least squares) to the PSE profiles of 2025, see profiles.py.
# Offshore points are approximate centres of the Polish Baltic wind farm areas (Baltic Power, Baltica, Bałtyk,
# BC-Wind) read off public maps of the projects; the offshore profile is their plain average.

period = { start = "2010-01-01", end = "2026-09-30" }

